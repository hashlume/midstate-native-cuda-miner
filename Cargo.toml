[package]
name = "midstate-native-cuda-miner"
version = "0.3.0-cmp.5"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde_json = "1.0"
tokio = { version = "1.35", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }

[build-dependencies]
cc = "1.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
