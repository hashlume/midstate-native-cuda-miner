name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64-cuda12:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install system build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc g++ make pkg-config tar gzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test and build
        run: |
          cargo test --release
          cargo build --release
          ./target/release/midstate-native-cuda-miner --version

      - name: Package
        run: |
          mkdir -p dist/midstate-native-cuda-miner-linux-x86_64-cuda12
          cp target/release/midstate-native-cuda-miner README.md LICENSE dist/midstate-native-cuda-miner-linux-x86_64-cuda12/
          tar -C dist -czf midstate-native-cuda-miner-linux-x86_64-cuda12.tar.gz midstate-native-cuda-miner-linux-x86_64-cuda12
          sha256sum midstate-native-cuda-miner-linux-x86_64-cuda12.tar.gz > SHA256SUMS-linux.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midstate-native-cuda-miner-linux-x86_64-cuda12
          path: |
            midstate-native-cuda-miner-linux-x86_64-cuda12.tar.gz
            SHA256SUMS-linux.txt

  windows-x86_64-cuda12:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA 12.8
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          cuda: "12.8.0"
          method: network

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: pwsh
        run: |
          nvcc --version
          cargo build --release
          .\target\release\midstate-native-cuda-miner.exe --version

      - name: Package
        shell: pwsh
        run: |
          $package = "midstate-native-cuda-miner-windows-x86_64-cuda12"
          New-Item -ItemType Directory -Force -Path "dist\$package" | Out-Null
          Copy-Item "target\release\midstate-native-cuda-miner.exe" "dist\$package\"
          Copy-Item README.md, LICENSE "dist\$package\"
          Compress-Archive -Path "dist\$package" -DestinationPath "$package.zip" -Force
          $hash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $package.zip" | Set-Content -NoNewline SHA256SUMS-windows.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midstate-native-cuda-miner-windows-x86_64-cuda12
          path: |
            midstate-native-cuda-miner-windows-x86_64-cuda12.zip
            SHA256SUMS-windows.txt

  publish-linux:
    needs:
      - linux-x86_64-cuda12
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish Linux release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/midstate-native-cuda-miner-linux-x86_64-cuda12.tar.gz
            release/SHA256SUMS-linux.txt

  publish-windows:
    needs:
      - windows-x86_64-cuda12
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish Windows release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/midstate-native-cuda-miner-windows-x86_64-cuda12.zip
            release/SHA256SUMS-windows.txt
