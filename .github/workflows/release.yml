name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64-cuda:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install system build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc g++ make pkg-config tar gzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test and build
        run: |
          cargo test --release
          cargo build --release
          ./target/release/midstate-native-cuda-miner --version

      - name: Package
        run: |
          mkdir -p dist/midstate-native-cuda-miner-linux-x86_64-cuda12
          cp target/release/midstate-native-cuda-miner README.md LICENSE dist/midstate-native-cuda-miner-linux-x86_64-cuda12/
          tar -C dist -czf midstate-native-cuda-miner-linux-x86_64-cuda12.tar.gz midstate-native-cuda-miner-linux-x86_64-cuda12
          sha256sum midstate-native-cuda-miner-linux-x86_64-cuda12.tar.gz > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: midstate-native-cuda-miner-linux-x86_64-cuda12
          path: |
            midstate-native-cuda-miner-linux-x86_64-cuda12.tar.gz
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            midstate-native-cuda-miner-linux-x86_64-cuda12.tar.gz
            SHA256SUMS.txt
